name: Diag - fetch Kudu startup logs

on:
  push:
    branches:
      - diag/kudu-logs
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect app settings and test storage connectivity
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8C0C590936F547DB86BAFE1C7C926A6A }}
        run: |
          $xml = [xml]$env:PUBLISH_PROFILE
          $p = $xml.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1
          if (-not $p) { $p = $xml.publishData.publishProfile | Select-Object -First 1 }
          $pair = "$($p.userName):$($p.userPWD)"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $h = @{ Authorization = "Basic $b64" }
          $scm = "https://func-emea-we-dssprod-mycimar-portal-001.scm.azurewebsites.net"

          Write-Host "=== Site processes (is w3wp alive?) ==="
          try {
            $procs = Invoke-RestMethod -Uri "$scm/api/processes" -Headers $h
            $procs | ForEach-Object { Write-Host ("{0}  {1}" -f $_.id, $_.name) }
          } catch { Write-Host "processes API failed: $($_.Exception.Message)" }

          Write-Host ""
          Write-Host "=== App settings (names only + selected non-secret values) ==="
          $settings = Invoke-RestMethod -Uri "$scm/api/settings" -Headers $h
          $names = $settings.PSObject.Properties.Name | Sort-Object
          Write-Host ($names -join ", ")
          foreach ($n in @('FUNCTIONS_EXTENSION_VERSION','FUNCTIONS_WORKER_RUNTIME','WEBSITE_RUN_FROM_PACKAGE','WEBSITE_CONTENTSHARE','netFrameworkVersion','FUNCTIONS_INPROC_NET8_ENABLED')) {
            if ($names -contains $n) { Write-Host "$n = $($settings.$n)" }
          }

          Write-Host ""
          Write-Host "=== AzureWebJobsStorage connectivity test (no secrets printed) ==="
          $conn = $settings.AzureWebJobsStorage
          if (-not $conn) {
            Write-Host "RESULT: AzureWebJobsStorage IS MISSING from app settings"
          } else {
            $acct = if ($conn -match 'AccountName=([^;]+)') { $matches[1] } else { '(unparsed)' }
            Write-Host "AzureWebJobsStorage present, AccountName=$acct, length=$($conn.Length)"
            $out = az storage container list --connection-string "$conn" --only-show-errors --output none 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "RESULT: STORAGE OK - key auth works, account reachable"
            } else {
              Write-Host "RESULT: STORAGE FAIL (exit $LASTEXITCODE)"
              $out | ForEach-Object { $_.ToString() } | Select-Object -First 15 | Write-Host
            }
            # also check content share setting used by the host on consumption/premium
            $cconn = $settings.WEBSITE_CONTENTAZUREFILECONNECTIONSTRING
            if ($cconn) {
              $out2 = az storage share list --connection-string "$cconn" --only-show-errors --output none 2>&1
              if ($LASTEXITCODE -eq 0) { Write-Host "RESULT: CONTENT FILE SHARE STORAGE OK" }
              else { Write-Host "RESULT: CONTENT FILE SHARE STORAGE FAIL (exit $LASTEXITCODE)"; $out2 | ForEach-Object { $_.ToString() } | Select-Object -First 15 | Write-Host }
            } else { Write-Host "No WEBSITE_CONTENTAZUREFILECONNECTIONSTRING setting" }
          }
